<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svelte Sample (good) — a11y SDK</title>
    <style>
      /* Meets WCAG 2.5.8 Target Size (Minimum): every button, text-like
         input, and nav/skip link is at least 24x24px, so behave:target-size
         and axe's target-size rule both pass cleanly. */
      button,
      input[type="text"],
      input[type="email"],
      input[type="search"],
      nav a,
      .skip-link {
        display: inline-block;
        min-height: 24px;
        padding: 4px 8px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/good-main.js"></script>
  </body>
</html>

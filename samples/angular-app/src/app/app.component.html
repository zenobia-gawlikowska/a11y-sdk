<!-- A11Y ERRORS INTENTIONAL — used to validate a11y-sdk detection -->
<!-- Errors present:
  [1] <html> has no lang attribute (in index.html)
  [2] <img> missing alt
  [3] <button> with no accessible name (icon-only, no aria-label)
  [4] <input> with no associated <label>
  [5] <div> used as interactive element (no role, no keyboard handler)
  [6] <a> with generic "read more" text
  [7] Heading hierarchy skips h1 → h4
-->

<!-- [7] no h1, h2, or h3 above this -->
<h4>Dashboard</h4>

<!-- [2] missing alt -->
<img src="https://placehold.co/200x150" />

<!-- [6] generic link text -->
<p>See the full report — <a href="/report">read more</a></p>

<!-- [4] input with no label -->
<div>
  <input type="text" placeholder="Filter results…" />
</div>

<!-- [3] icon button with no accessible name -->
<button (click)="onAction()">⚙️</button>

<!-- [5] div acting as a button -->
<div
  style="cursor: pointer; padding: 8px; background: #eee"
  (click)="onAction()"
>
  Export data
</div>

<table>
  <!-- [missing] table has no <caption> and headers have no scope -->
  <tr>
    <th>Name</th>
    <th>Value</th>
  </tr>
  <tr>
    <td>Metric A</td>
    <td>42</td>
  </tr>
</table>
